<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="keywords" content="bridge composer, prédimensionnement pont, descente de charges, métré pont, estimation pont, PSI-DA, PSI-DP, VIPP, PRAD, PRP, bipoutre mixte, EN 1991-2, Fascicule 61, LM71, DXF AutoCAD">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--chrome:#f1f3f6;--chrome2:#e6e9ee;--line:#cfd4dc;--line2:#b9c0ca;
  --txt:#1b2230;--mute:#5d6676;--acc:#1f5fd1;--acc2:#174aa6;--sel:#dbe8fd;--hov:#eaf1fd;
  --warn:#9a6700;--danger:#c92a2a;--ok:#2b8a3e;--gold:#a8842a;
  --tree-w:280px;--prop-w:330px;
  --ui:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
}
html,body{height:100%}
body{font-family:var(--ui);font-size:12px;color:var(--txt);background:var(--bg);line-height:1.35;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c4cad3;border:2px solid #f1f3f6;border-radius:6px}::-webkit-scrollbar-track{background:#f1f3f6}

/* ─── barre de titre ─── */
.titlebar{flex:none;height:32px;display:flex;align-items:center;gap:12px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line)}
.logo{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;white-space:nowrap;color:#14171f}
.logo span{color:var(--gold)}
.tb-sep{width:1px;height:16px;background:var(--line)}
.tb-app{font-weight:600;white-space:nowrap}
.tb-doc{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-right{margin-left:auto;display:flex;gap:14px;align-items:center;white-space:nowrap}
.tb-right a{color:var(--mute)}.tb-right a:hover{color:var(--acc)}

/* ─── onglets de menu + ruban ─── */
.menubar{flex:none;display:flex;gap:2px;padding:0 6px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.menubar::-webkit-scrollbar{display:none}
.mtab{border:1px solid transparent;border-bottom:none;background:none;padding:5px 14px 4px;margin-top:3px;border-radius:4px 4px 0 0;cursor:pointer;white-space:nowrap;color:#2c3443}
.mtab:hover{background:#e3e7ed}
.mtab.on{background:#fff;border-color:var(--line);position:relative;top:1px;color:var(--acc2);font-weight:600}
.mtab.file{background:var(--acc);color:#fff;font-weight:600}
.mtab.file.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.ribbon{flex:none;display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--line);height:92px;overflow-x:auto;overflow-y:hidden}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--chrome2);padding:4px 4px 0;flex:none}
.rbtns{flex:1;display:flex;align-items:flex-start;gap:2px}
.rlabel{text-align:center;font-size:10.5px;color:var(--mute);padding:2px 0 3px;white-space:nowrap}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:52px;max-width:74px;height:66px;padding:4px 4px 2px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;text-align:center;line-height:1.1;font-size:11px;color:#253041}
.rb svg{width:30px;height:30px;flex:none;stroke:#2c4a7a;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rb svg.w{width:44px}
.rb:hover{background:var(--hov);border-color:#b5cdf3}
.rb.on{background:var(--sel);border-color:#7da7ec}
.rb:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.rcol{display:flex;flex-direction:column;gap:1px;justify-content:flex-start}
.rs{display:flex;align-items:center;gap:6px;height:21px;padding:0 6px 0 3px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;white-space:nowrap;font-size:11.5px;color:#253041;text-align:left}
.rs svg{width:16px;height:16px;flex:none;stroke:#2c4a7a;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rs:hover{background:var(--hov);border-color:#b5cdf3}
.rs.on{background:var(--sel);border-color:#7da7ec}
.rs:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.rs .box{width:12px;height:12px;border:1px solid #8a93a3;border-radius:2px;background:#fff;display:grid;place-items:center}
.rs.on .box{background:var(--acc);border-color:var(--acc)}
.rs.on .box::after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 1.6px 1.6px;transform:rotate(-45deg) translate(0,-1px)}
.rfield{display:flex;align-items:center;gap:6px;height:22px;font-size:11.5px;white-space:nowrap;padding:0 3px}
.rfield select,.rfield input{height:20px;border:1px solid var(--line2);border-radius:2px;background:#fff;padding:0 3px;font-size:11.5px}
.rfield input{width:58px;text-align:right}

/* ─── zone de travail ─── */
.work{flex:1;min-height:0;display:grid;grid-template-columns:var(--tree-w) 5px minmax(0,1fr) 5px var(--prop-w)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:#fff}
.ph{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:24px;padding:0 8px;background:linear-gradient(#f7f8fa,#e9ecf1);border-bottom:1px solid var(--line);font-weight:600;font-size:11.5px;color:#2c3443;white-space:nowrap}
.ph small{font-weight:400;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.left{border-right:1px solid var(--line)}
.left .tree{flex:1;min-height:0;overflow:auto;padding:3px 0}
.right .props{flex:1;min-height:0;overflow:auto}
.right{border-left:1px solid var(--line)}
.vsplit{cursor:col-resize;background:var(--chrome);border-right:1px solid var(--line);border-left:1px solid var(--line)}
.vsplit:hover{background:#c9dafa}

/* arborescence */
.tree ul{list-style:none}
.tree ul ul{padding-left:15px}
.tn{display:flex;align-items:center;gap:4px;height:22px;padding:0 6px 0 2px;cursor:pointer;white-space:nowrap;border:1px solid transparent;border-radius:2px;margin:0 3px;user-select:none}
.tn:hover{background:var(--hov)}
.tn.sel{background:var(--sel);border-color:#7da7ec}
.tn .tw{width:13px;height:13px;flex:none;display:grid;place-items:center;color:#6b7383;font-size:9px}
.tn .tw.c::before{content:"▸"}.tn .tw.o::before{content:"▾"}
.tn .ti{width:16px;height:16px;flex:none}
.tn .ti svg{width:16px;height:16px;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tn .tl{overflow:hidden;text-overflow:ellipsis}
.tn .tv{color:var(--mute);margin-left:2px}
.tn .wb{margin-left:auto;color:#d29b14;font-weight:700}

/* propriétés : grille nom / valeur */
table.pg{width:100%;border-collapse:collapse;table-layout:fixed}
.pg td{border-bottom:1px solid #edf0f3;height:24px;padding:0 6px;vertical-align:middle}
.pg td:first-child{width:52%;color:#2c3443;border-right:1px solid #edf0f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg tr.grp td{background:var(--chrome);font-weight:600;color:#2c3443;height:22px;border-right:none}
.pg tr.ro td:last-child{color:var(--mute)}
.pg td.v{padding:0 2px}
.pg input[type=text],.pg select{width:100%;height:21px;border:1px solid transparent;border-radius:2px;background:transparent;padding:0 4px;font-variant-numeric:tabular-nums}
.pg input[type=text]{text-align:right}
.pg input.txt{text-align:left}
.pg input[type=text]:hover,.pg select:hover{border-color:var(--line2);background:#fff}
.pg input[type=text]:focus,.pg select:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 2px rgba(31,95,209,.15)}
.pg input::placeholder{color:#9aa1ad}
.pg .u{display:flex;align-items:center;gap:3px}
.pg .u span{flex:none;color:var(--mute);font-size:11px;width:26px}
.pg input[type=checkbox]{width:14px;height:14px;accent-color:var(--acc);margin-left:4px;vertical-align:middle}
.pg .note td{height:auto;padding:5px 6px;color:var(--mute);font-size:11px;line-height:1.45;white-space:normal;border-right:none}
.pg .btns td{padding:4px 6px;border-right:none}
.mini{height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:3px;background:linear-gradient(#fff,#eef1f5);cursor:pointer;font-size:11.5px}
.mini:hover{border-color:#7da7ec;background:var(--hov)}
.mini:disabled{opacity:.45;cursor:default}

/* vue graphique */
.center{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.stage{position:relative;min-height:0;min-width:0}
.stage>.canvas,.stage>.tpane{position:absolute;inset:0}
.tpane{display:flex;flex-direction:column;background:#fff}
[hidden]{display:none !important}
.doctabs{display:flex;align-items:flex-end;gap:2px;padding:3px 6px 0;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0}
.dtl{display:flex;gap:2px;align-items:flex-end;min-width:0;overflow-x:auto;scrollbar-width:none}.dtl::-webkit-scrollbar{display:none}
.dtab.tt{padding-right:4px}
.dtab svg{width:14px;height:14px;stroke:#c2410c;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dtab .dx{border:none;background:none;width:18px;height:18px;border-radius:3px;cursor:pointer;color:#6b7383;font-size:14px;line-height:1}
.dtab .dx:hover{background:#f3c9c9;color:var(--danger)}
.dtab .bd,.ktab .bd{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:#d29b14;color:#fff;font-size:10px;font-weight:600;text-align:center}
.dtab{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-bottom:none;background:#e9ecf1;padding:4px 12px;border-radius:3px 3px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;color:#3a4352}
.dtab.on{background:#fff;color:var(--txt);font-weight:600}
.vtools{margin-left:auto;display:flex;gap:1px;padding-bottom:3px}
.vt{width:26px;height:24px;display:grid;place-items:center;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer}
.vt svg{width:17px;height:17px;stroke:#2c4a7a;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vt:hover{background:var(--hov);border-color:#b5cdf3}
.vt.on{background:var(--sel);border-color:#7da7ec}
.canvas{position:relative;overflow:hidden;background:#fff;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.canvas.drag{cursor:grabbing}
#svgHost svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.canvas [data-tag]{cursor:pointer}
.canvas path[data-tag]:hover{stroke:var(--acc) !important}
.canvas path[data-tag].sel{stroke:#e8590c !important;stroke-width:2.2 !important}
.canvas text[data-tag].sel{fill:#e8590c !important}
.axes{position:absolute;left:10px;bottom:8px;pointer-events:none;width:46px;height:46px}
.vinfo{position:absolute;right:10px;top:8px;pointer-events:none;font-size:11px;color:var(--mute);text-align:right;background:rgba(255,255,255,.85);padding:2px 4px;border-radius:2px}
.hsplit{cursor:row-resize;background:var(--chrome);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dock{display:flex;flex-direction:column;min-height:0;background:#fff}
.dtabs{flex:none;display:flex;gap:0;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.ktab{border:none;border-right:1px solid var(--line);background:none;padding:4px 12px;cursor:pointer;white-space:nowrap;color:#3a4352}
.ktab:hover{background:#e3e7ed}
.ktab.on{background:#fff;color:var(--acc2);font-weight:600;box-shadow:inset 0 2px 0 var(--acc)}
.ktab .bd{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;background:#d29b14;color:#fff;font-size:10px;font-weight:600;text-align:center}
.dock-b{flex:1;min-height:0;overflow:auto;padding:8px 10px 12px}

/* tableaux de résultats */
.dock-b h4{font-size:12px;font-weight:600;margin:10px 0 4px;color:#2c3443}
.dock-b h4:first-child{margin-top:0}
.dock-b h4 small{font-weight:400;color:var(--mute);margin-left:6px}
.dock-b .hint{color:var(--mute);line-height:1.5;margin:4px 0}
.dock-b .hint b{color:var(--txt);font-weight:600}
.dock-b .notes{padding-left:18px;color:var(--mute);margin-top:8px;line-height:1.55}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
.t th{position:sticky;top:-8px;background:#eef1f5;font-weight:600;text-align:right;padding:3px 8px;border:1px solid var(--line);white-space:nowrap;color:#2c3443;z-index:1}
.t td{padding:2px 8px;border:1px solid #e3e7ec;text-align:right;white-space:nowrap}
.t th:first-child,.t td:first-child,.t .l{text-align:left}
.t td.l{white-space:normal;min-width:220px}
.t .tx,.t td.mute{text-align:left}
.t tbody tr:nth-child(even) td{background:#fafbfc}
.t tbody tr:hover td{background:var(--hov)}
.t tr.lot td{background:#eef3fb !important;font-weight:600;color:var(--acc2)}
.t tr.tot td{font-weight:600;background:#f4f6f9 !important}
.t tr.grand td{font-weight:700;background:#e3ecfb !important;color:var(--acc2);border-top:2px solid var(--acc)}
.t td small{color:var(--mute)}
.t .mute{color:var(--mute)}
.t .ok{color:var(--ok)}.t .ko{color:var(--danger);font-weight:600}
.t tr.pick{cursor:pointer}
.t tr.selr td{background:#fde9dc !important}
.msgl{list-style:none;display:grid;gap:3px}
.msgl li{display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.msgl li::before{flex:none;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
.msgl li.w::before{content:"!";background:#d29b14}
.msgl li.i::before{content:"i";background:#5b7db8;font-style:italic}
.msgl li.o::before{content:"✓";background:var(--ok)}

/* menu contextuel */
.cmenu{position:fixed;z-index:500;min-width:220px;max-width:300px;background:#fff;border:1px solid #aab3c0;border-radius:4px;box-shadow:0 8px 24px -6px rgba(20,30,50,.35);padding:3px 0;font-size:12px}
.cmenu .mh{padding:4px 12px 2px;font-size:10.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.cmenu button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:4px 12px 4px 8px;text-align:left;cursor:pointer;white-space:nowrap}
.cmenu button svg{width:16px;height:16px;flex:none;stroke:#2c4a7a;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cmenu button .ck{width:16px;flex:none;text-align:center;color:var(--acc);font-weight:700}
.cmenu button:hover,.cmenu button:focus{background:var(--sel);outline:none}
.cmenu button:disabled{opacity:.45;cursor:default;background:none}
.cmenu button.danger{color:var(--danger)}
.cmenu button kbd{margin-left:auto;font:inherit;font-size:11px;color:var(--mute)}
.cmenu hr{border:none;border-top:1px solid var(--chrome2);margin:3px 0}

/* barre d'état */
.status{flex:none;display:flex;align-items:center;gap:0;height:23px;background:var(--chrome);border-top:1px solid var(--line);font-size:11px;color:#3a4352;overflow:hidden}
.status span{padding:0 10px;border-right:1px solid var(--line);white-space:nowrap;line-height:23px}
.status span b{font-weight:600;color:var(--txt)}
.status .grow{flex:1;border-right:none;overflow:hidden;text-overflow:ellipsis}
.status .w{color:var(--warn);cursor:pointer}
#print{display:none}

/* ─── tablette et téléphone : empilement, défilement de page ─── */
@media(max-width:999px){
  html,body{height:auto}
  body{overflow:auto}
  .titlebar .tb-doc{display:none}
  .ribbon{height:auto;min-height:88px}
  .work{display:flex;flex-direction:column}
  .vsplit{display:none}
  .stage{height:min(72vw,460px);order:2}
  .right{order:3;border-left:none;border-top:1px solid var(--line)}
  .right .props{flex:none;overflow:visible}
  .center{display:contents}
  .doctabs{order:1}
  .left{order:4;border-right:none;border-top:1px solid var(--line)}
  .dock-b{overflow:auto}
  .left .tree{max-height:none;flex:none}
  .left .props{flex:none;max-height:none}
  .t th{position:static}
  .status{flex-wrap:wrap;height:auto}
  .status span{border-right:none}
  .status .grow{flex-basis:100%}
}
@media(max-width:640px){
  .tb-app{display:none}
  .pg td:first-child{width:50%}
}
@media print{
  @page{size:A4 portrait;margin:12mm 12mm 14mm}
  html,body{background:#fff;display:block;min-height:0;height:auto;overflow:visible}
  body > *:not(#print){display:none !important}
  #print{display:block;color:#111;font-family:'Outfit',Arial,sans-serif;font-size:9pt;line-height:1.4}
  .p-cart{display:grid;grid-template-columns:1.1fr 2fr 1.2fr;border:1px solid #333;margin-bottom:10pt}
  .p-cart>div{padding:5pt 7pt;border-right:1px solid #333}
  .p-cart>div:last-child{border-right:none}
  .p-bet{font-family:'Cormorant Garamond',serif;font-size:14pt;font-weight:600;line-height:1.1}
  .p-bet small{display:block;font-family:'Outfit',Arial,sans-serif;font-size:7pt;font-weight:300;color:#555;margin-top:2pt}
  .p-title{text-align:center}
  .p-k{font-size:7pt;letter-spacing:.14em;text-transform:uppercase;color:#7a5c1c}
  .p-n{font-family:'Cormorant Garamond',serif;font-size:16pt;font-weight:600;line-height:1.15}
  .p-meta{font-size:7.5pt;line-height:1.5}
  h2.p-h{font-size:10.5pt;font-weight:500;color:#7a5c1c;border-bottom:1px solid #b9a26b;padding-bottom:2pt;margin:10pt 0 5pt;break-after:avoid}
  h3.p-h3{font-size:9pt;font-weight:500;margin:6pt 0 3pt;break-after:avoid}
  #print p{margin:0 0 4pt}
  .p-fig{text-align:center;break-inside:avoid;margin:4pt 0 6pt}
  .p-fig svg{max-width:100%;height:auto;max-height:118mm}
  .p-fig figcaption{font-size:7.5pt;color:#555;margin-top:2pt}
  .p-tab{width:100%;border-collapse:collapse;font-size:7.8pt;margin:2pt 0 6pt}
  .p-tab th,.p-tab td{border:1px solid #999;padding:1.5pt 4pt;text-align:right}
  .p-tab th{background:#f1ede2;font-weight:500;text-align:center}
  .p-tab td:first-child,.p-tab .l{text-align:left}
  .p-tab tr{break-inside:avoid}
  .p-tab tr.lot td{background:#f7f3e8;font-weight:500}
  .p-tab tr.tot td{font-weight:600;background:#f1ede2}
  .p-warn{border:1px solid #d9b45a;background:#fff8e6;padding:4pt 6pt;font-size:8pt;margin:4pt 0}
  .p-break{break-before:page}
  .p-small{font-size:7.6pt;color:#333}
  .p-small ul{padding-left:12pt}
  .p-2{display:grid;grid-template-columns:1fr 1fr;gap:10pt}
}
</style>
</head>

  <span class="tb-right"><a href="ponts-types.html">Ponts types</a><a href="index.html">← Accueil</a></span>
</header>

<nav class="menubar" id="menubar" aria-label="Menus">

  <button class="mtab on" data-m="resultats">Résultats</button>
  <button class="mtab" data-m="affichage">Affichage</button>
</nav>
<div class="ribbon" id="ribbon" role="toolbar" aria-label="Commandes"></div>

<div class="work" id="work">
  <aside class="pane left" aria-label="Arborescence de l’ouvrage">
    <div class="ph">Arborescence de l’ouvrage<small id="treeSub"></small></div>
    <div class="tree" id="tree" role="tree"></div>
  </aside>
  <div class="vsplit" id="vsplit" title="Redimensionner"></div>
  <section class="center">
    <div class="doctabs">
      <div class="dtl" id="dtabsList" role="tablist"></div>
      <div class="vtools" id="vtools"></div>
    </div>
    <div class="stage">
      <div class="canvas" id="cv">
        <div id="svgHost"></div>
        <svg class="axes" id="axes2d" viewBox="0 0 46 46" aria-hidden="true"><path d="M8 38h30M8 38V8" stroke="#c92a2a" stroke-width="1.4" fill="none"/><path d="M38 38l-5-3v6zM8 8l-3 5h6z" fill="#c92a2a"/><text x="40" y="41" font-size="9" fill="#c92a2a">X</text><text x="11" y="9" font-size="9" fill="#c92a2a">Z</text></svg>
        <div class="vinfo" id="vinfo"></div>
      </div>
      <div class="tpane" id="tpane" hidden><div class="dock-b" id="res"></div></div>
    </div>
  </section>
  <div class="vsplit" id="psplit" title="Redimensionner"></div>
  <aside class="pane right" aria-label="Propriétés">
    <div class="ph">Propriétés<small id="propSub"></small></div>
    <div class="props" id="props"></div>
  </aside>
</div>
<div class="cmenu" id="cmenu" role="menu" hidden></div>

<footer class="status" id="status"></footer>

<input type="file" id="fOpen" accept=".json,application/json" class="sr">
<div id="print" aria-hidden="true"></div>

<script src="composer/calc.js?v=4"></script>
<script src="composer/draw.js?v=4"></script>
<script src="composer/dxf.js?v=4"></script>
<script src="composer/view3d.js?v=4"></script>
<script src="composer/app.js?v=4"></script>
