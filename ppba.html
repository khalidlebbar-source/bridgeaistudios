<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BridgeAI Studios — PPBA</title>
<meta name="description" content="Calcul des tabliers à poutres préfabriquées en béton armé (PPBA) : sollicitations Guyon-Massonnet, fascicule 61 titre II, ferraillage BAEL 91, épure, contre-flèche, hourdis, dallette, entretoises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f8f5;--bg2:#f0ede8;--white:#fff;
  --ink:#18191f;--ink2:#3c3f4d;--ink3:#7a7e8e;
  --gold:#a07828;--gold2:#c9a84c;--gold-bg:#fdf8ee;--gold-border:#e8d5a0;
  --blue:#1a4fd6;--teal:#0a8a78;--red:#c0392b;
  --border:#e2ddd6;--shadow:0 1px 8px rgba(0,0,0,.06);
}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:2px}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;background:rgba(249,248,245,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1280px;margin:0 auto}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--ink);text-decoration:none;letter-spacing:.01em}
.nav-logo span{color:var(--gold)}
.nav-center{display:flex;align-items:center;gap:6px}
.nav-norm{display:flex;gap:2px;background:var(--bg2);border-radius:6px;padding:3px;border:1px solid var(--border)}
.norm-btn{padding:5px 14px;border-radius:4px;border:none;font-size:11px;font-weight:400;cursor:pointer;background:transparent;color:var(--ink3);font-family:'Outfit',sans-serif;letter-spacing:.05em;transition:all .2s}
.norm-btn.active{background:var(--gold);color:var(--white);font-weight:500}
.nav-right{display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;gap:2px;background:var(--bg2);border-radius:6px;padding:3px;border:1px solid var(--border)}
.lang-btn{padding:4px 10px;border-radius:4px;border:none;font-size:11px;cursor:pointer;background:transparent;color:var(--ink3);font-family:'Outfit',sans-serif;letter-spacing:.05em;transition:all .2s}
.lang-btn.active{background:var(--gold);color:var(--white);font-weight:500}
.nav-back{font-size:12px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s}
.nav-back:hover{color:var(--ink)}
.nav-back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:220px 1fr;max-width:1280px;margin:0 auto;padding:0 40px;min-height:calc(100vh - 56px)}

/* ── SIDEBAR ── */
.sidebar{border-right:1px solid var(--border);padding:28px 20px 40px 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.sidebar-section{margin-bottom:6px}
.sidebar-label{font-size:9px;font-weight:500;color:var(--ink3);letter-spacing:.16em;text-transform:uppercase;padding:0 10px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:all .18s;border:1px solid transparent;margin-bottom:2px}
.nav-item:hover{background:var(--white);border-color:var(--border)}
.nav-item.active{background:var(--white);border-color:var(--gold-border);box-shadow:var(--shadow)}
.nav-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.nav-label{font-size:12px;color:var(--ink3);transition:color .2s}
.nav-item.active .nav-label,.nav-item:hover .nav-label{color:var(--ink);font-weight:400}

/* ── CONTENT ── */
.content{padding:36px 0 60px 44px}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:32px}
.page-eyebrow{font-size:10px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--ink);margin-bottom:10px;line-height:1.2}
.norm-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--gold-bg);border:1px solid var(--gold-border);font-size:10px;color:var(--gold);letter-spacing:.08em;margin-bottom:8px}
.page-desc{font-size:13px;color:var(--ink3);line-height:1.7;max-width:560px;font-weight:300}
.page-divider{height:1px;background:var(--border);margin:24px 0}

/* ── SCHEMA ── */
.schema{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;justify-content:center}

/* ── CARD ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:9px;font-weight:500;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}

/* ── FORM ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink3);letter-spacing:.02em}
.field input,.field select{height:36px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border-color .2s,background .2s}
.field input:focus,.field select:focus{border-color:var(--gold2);background:var(--white)}
.fu{position:relative}
.fu input{padding-right:40px}
.fu-unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink3);pointer-events:none}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-primary{padding:9px 22px;border-radius:7px;background:var(--gold);border:none;color:var(--white);font-size:12px;font-weight:400;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:.05em;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.btn-secondary{padding:9px 16px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--ink3);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s}
.btn-secondary:hover{border-color:var(--ink3);color:var(--ink)}
.btn-pdf{padding:9px 16px;border-radius:7px;background:transparent;border:1px solid var(--gold-border);color:var(--gold);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;letter-spacing:.04em;transition:all .2s}
.btn-pdf:hover{background:var(--gold-bg);border-color:var(--gold2)}
.err{display:none;padding:9px 13px;border-radius:7px;background:#fdf2f2;border:1px solid #f5c0be;color:var(--red);font-size:12px;margin-bottom:14px}
.err.on{display:block}


/* ── PPBA ── */
.vg-tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.vg-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.vg-box{flex:2 1 440px;min-width:0;user-select:none;-webkit-user-select:none}
.vg-side{flex:1 1 260px;min-width:0}
table.jt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.jt td.ko{color:var(--red)}
table.jt tr.sel td{background:var(--gold-bg)}
.vg-side .res-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.vg-side .res-val{font-size:19px}
.field{min-width:0}.fu{width:100%}.field input,.field select{width:100%}
.btn-secondary.file{line-height:16px}
.nav-num{width:16px;font-size:10px;color:var(--ink3);text-align:right;flex-shrink:0}
.nav-item.active .nav-num{color:var(--gold)}
.side-actions{display:flex;flex-direction:column;gap:6px;margin-top:22px;padding:0 6px}
.side-actions .btn-primary,.side-actions .btn-secondary{width:100%;text-align:center}
.btn-secondary.file{display:block;cursor:pointer}
.schema svg{width:100%;max-width:680px;height:auto;max-height:420px}
.usr{color:#c0392b!important}
.code{font-size:9px;color:var(--blue);letter-spacing:.06em;margin-left:4px}
.chks{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:16px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:4px 0 14px}
.derived div{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink3)}
.derived b{color:var(--ink);font-weight:500}
.hint{font-size:11.5px;color:var(--ink3);margin:6px 0 10px;line-height:1.6}
.tscroll{overflow-x:auto;margin-bottom:12px}
table.ed{border-collapse:collapse;font-size:12px}
table.ed th{font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;padding:6px;border-bottom:1px solid var(--border)}
table.ed td{padding:3px 4px;border-bottom:1px solid rgba(226,221,214,.5)}
input.cell,select.cell{height:30px;padding:0 6px;border:1px solid var(--border);border-radius:5px;background:var(--bg);font-family:'Outfit',sans-serif;font-size:12px}
.mini{border:1px solid var(--border);background:transparent;border-radius:5px;width:26px;height:26px;cursor:pointer;color:var(--ink3)}
.mini:hover{color:var(--red);border-color:var(--red)}
.sketch{font-family:'Outfit',sans-serif}
.sketch .slab{fill:#f1ede6;stroke:#7a7e8e;stroke-width:1}
.sketch .trot{fill:#ddd6ca;stroke:#7a7e8e;stroke-width:.8}
.sketch .beam{fill:#e8e3db;stroke:#3c3f4d;stroke-width:1}
.sketch .dim line{stroke:var(--blue);stroke-width:.8}
.sketch .dim text,.sketch .dimt{fill:var(--blue);font-size:11px}
.sketch .dim.hi line{stroke:#c0392b;stroke-width:1.6}.sketch .dim.hi text{fill:#c0392b;font-weight:600}
.sketch .lbl{fill:var(--ink3);font-size:11px}
.sketch .load{stroke:var(--ink2);stroke-width:1.2}.sketch .arrow{fill:var(--ink2)}.sketch .jack{fill:var(--gold2);stroke:var(--gold);stroke-width:.8}
.status{display:none;padding:9px 13px;border-radius:7px;background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);font-size:12px;margin-bottom:14px}
.status.on{display:block}.status.err{background:#fdf2f2;border-color:#f5c0be;color:var(--red)}
.alert{padding:8px 12px;border-radius:7px;font-size:12.5px;margin-bottom:6px;line-height:1.55}
.alert.attention{background:#fdf6ec;border:1px solid #efd3a6;color:#8a5a12}
.alert.info{background:var(--bg);border:1px solid var(--border);color:var(--ink2)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.res-card{background:var(--bg);border-radius:8px;padding:12px;border:1px solid var(--border)}
.res-card.hi{border-color:var(--gold-border);background:var(--gold-bg)}
.res-card.ko{border-color:#f5c0be;background:#fdf2f2}
.res-lbl{font-size:9px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.res-val{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:300;color:var(--ink)}
.res-unit{font-size:10px;color:var(--ink3);margin-left:2px;font-family:'Outfit',sans-serif}
.res-note{font-size:10px;color:var(--ink3);margin-top:3px}
.ctable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.ctable th{padding:7px 10px;text-align:left;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);background:var(--bg2);border-bottom:1px solid var(--border)}
.ctable td{padding:6px 10px;border-bottom:1px solid rgba(226,221,214,.6);color:var(--ink2);font-variant-numeric:tabular-nums}
.ctable td.ko{color:var(--red)}
article.note{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:28px 34px;margin-top:14px}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:0 16px}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);padding:16px 0}.content{padding:20px 0 40px}.grid3,.grid4{grid-template-columns:1fr 1fr}nav{padding:0 16px}article.note{padding:16px}}
@media (max-width:520px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media print{nav,.sidebar,.page-header,.noprint,.status{display:none!important}.layout{display:block;padding:0}.content{padding:0}article.note{border:none;padding:0}body{background:#fff}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Bridge<span>AI</span> Studios</a>
    <div class="nav-center"><div class="nav-norm"><button class="norm-btn active">BAEL 91</button><button class="norm-btn" disabled title="Prochainement">EC2</button></div></div>
    <div class="nav-right">
      <a href="ponts-types.html" class="nav-back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg><span>Ponts types</span></a>
    </div>
  </div>
</nav>
<div class="layout">
  <aside class="sidebar" id="side"></aside>
  <main class="content" id="main"></main>
</div>
<script>window.PPBA_WORKER = "ppba/ppba-worker.js";</script>
<script src="ppba/ppba-app.js"></script>
</body>
</html>
